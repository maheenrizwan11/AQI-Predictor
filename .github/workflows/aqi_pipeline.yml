name: Daily AQI Pipeline

on:
  schedule:
    - cron: '0 5 * * *'  # runs daily at 5 AM UTC
  workflow_dispatch:     # manual trigger from GitHub UI

jobs:
  aqi-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Build features
      run: python build_features.py

    - name: Engineer features
      run: python feature_engineering.py

    - name: Train Models
      run: python training.py 
        
    - name: Predict AQI
      run: python prediction.py

    - name: Upload features to Hopsworks
      env:
        HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
      run: python hopsworks_insert.py

    - name: Configure Git
      run: |
        git config --global user.name "maheenrizwan11"
        git config --global user.email "maheenrizwan10@gmail.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

    - name: Commit CSV changes
      run: |
        git add data/processed/features.csv data/processed/final_features.csv data/predictions/predicted_aqi.csv models/*.pkl
        git commit -m "Auto-update CSVs with latest predictions and updated models"
        git push
